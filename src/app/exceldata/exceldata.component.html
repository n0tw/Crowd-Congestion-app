<h2 mat-dialog-title #dialogTitle tabindex="0">{{ data.title }}</h2>
<div mat-dialog-content>
  <table mat-table [dataSource]="data.filteredExcelData" class="mat-elevation-z8">
    <ng-container *ngFor="let column of data.headers; let i = index" [matColumnDef]="column">
      <th mat-header-cell *matHeaderCellDef> {{ column }} </th>
      <td mat-cell *matCellDef="let element"> {{ element[i] }} </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="data.headers"></tr>
    <tr mat-row *matRowDef="let row; columns: data.headers;"></tr>
  </table>
</div>
<div mat-dialog-actions>
  <button mat-button (click)="closeDialog()">Close</button>
</div>
